services:
  # Expose all gRPC services to host
  user-services:
    ports:
      - "3001:3001"

  doctor-services:
    ports:
      - "3002:3002"

  patient-services:
    ports:
      - "3003:3003"

  appointment-services:
    ports:
      - "3004:3004"

  analysis-services:
    ports:
      - "3005:3005"
  
  notification-services:
    ports:
      - "3006:3006"

  medicine-services:
    ports:
      - "9090:9090"
  



  # Expose databases if needed for dev tools (Compass, Studio 3T, etc.)
  patient-mongo:
    ports:
      - "27016:27017"

  user-mongodb:
    ports:
      - "27017:27017" # Avoid conflict

  doctor-mongodb:
    ports:
      - "27018:27017"

  appointment-mongodb:
    ports:
      - "27019:27017"

  # Redis UI or direct redis-cli testing
  redis:
    ports:
      - "6378:6379"

  medicine-postgres:
    ports:
      - "5433:5432" 

  mysql-analysis:
    ports:
      - "3310:3306"
  
  rabbitmq-analysis:
    ports:
      - "15673:15672" # Management UI
      - "5673:5672"   # AMQP protocol

  mysql-notification:
    ports:
      - "3308:3306"

  rabbitmq-notification:
    ports:
      - "15674:15672" # Management UI
      - "5674:5672"   # AMQP protocol
