spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/medicine
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0  # Start version numbering at 0
    out-of-order: true  # Allow out-of-order migrations
    validate-on-migrate: false
  sql:
    init:
      mode: never
  ai:
    openai:
      speech:
        enabled: false

logging:
  level:
    net.devh.boot.grpc.server.serverfactory.GrpcServerLifecycle: DEBUG
    root: ERROR
    com.hcmus: INFO
    org:
      hibernate:
        SQL: OFF
      springframework:
        # jdbc: DEBUG
        web: DEBUG
        data: DEBUG
        boot:
          autoconfigure:
            data:
              rest: DEBUG
            orm: DEBUG
        security: DEBUG
    
server:
  port: 8080
  servlet:
    context-path: /api/v1

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: method
    display-request-duration: true
    doc-expansion: none
  packages-to-scan: uni.hcmus.medicineservice
  paths-to-match: /**

app:
  frontend-url: http://localhost:3000

grpc:
  server:
    port: 9090