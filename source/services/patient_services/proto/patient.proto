syntax = "proto3";

package patient;

service PatientService {
  rpc GetVisitHistory(GetVisitHistoryRequest) returns (VisitHistoryResponse);
  rpc GetPatientInfo(GetPatientInfoRequest) returns (PatientInfoResponse);
}

message GetVisitHistoryRequest {
  string patient_id = 1;
}

message Visit {
  string visit_id = 1;
  string department = 2;
  string visit_date = 3;
  string reason_for_visit = 4;
  string diagnosis = 5;
}

message VisitHistoryResponse {
  repeated Visit visits = 1;
}

message GetPatientInfoRequest {
  string patient_id = 1;
}

message PatientInfoResponse {
  string patient_id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
}
