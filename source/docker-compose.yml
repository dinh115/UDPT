services:
  # ========================== Databases ==========================
  patient-mongo:
    image: mongo:6.0
    container_name: patient-mongo
    networks:
      - internal
    volumes:
      - mongo-data:/data/db
      
  medicine-postgres:
    image: postgres:15
    container_name: medicine-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=medicine
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  user-mongodb:
    image: mongo:7
    container_name: user-services-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: user-services
    volumes:
      - user_mongodb_data:/data/db
      - ./services/user_services/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - internal
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  doctor-mongodb:
    image: mongo:7
    container_name: doctor-service-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: doctor-management
    volumes:
      - doctor_mongodb_data:/data/db
      - ./services/doctor_services/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - internal
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  appointment-mongodb:
    image: mongo:7
    container_name: appointment-service-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: appointment-management
    volumes:
      - appointment_mongodb_data:/data/db
      - ./services/appointment_services/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - internal
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # mysql:
  #   image: mysql:8
  #   container_name: mysql_service
  #   ports:
  #     - "3306:3306"
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root
  #     MYSQL_DATABASE: appointment_db
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - backend
  #   restart: unless-stopped

  # rabbitmq:
  #   image: rabbitmq:3-management
  #   container_name: rabbitmq_service
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   networks:
  #     - backend
  #   restart: unless-stopped

  # ========================== Cache ==========================
  redis:
    image: redis:7-alpine
    container_name: user-services-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: redis-server --appendonly yes

  # ========================== Core Services ==========================
  gateway:
    build:
      context: ./services/gateway
    ports:
      - "3000:3000"
    depends_on:
      - patient-services
      - user-services
      - doctor-services
      - appointment-services
      # - analysis-services
      - medicine-services
      # - notification-services
    networks:
      - internal
    volumes:
      - /app/node_modules
      - ./services/gateway:/app
      - ./services/patient_services/app/grpc:/app/shared_proto/patient
      - ./services/medicine_services/src/main/proto:/app/shared_proto/medicine
      - ./services/user_services/src/proto:/app/shared_proto/user
      - ./services/doctor_services/src/proto:/app/shared_proto/doctor
      - ./services/appointment_services/src/proto:/app/shared_proto/appointment
      - ./services/analysis_services/analysis.proto:/app/shared_proto/analysis
    environment:
      NODE_ENV: production
      USER_SERVICE_URL: user-services:3001
      DOCTOR_SERVICE_URL: doctor-services:3002
      APPOINTMENT_SERVICE_URL: appointment-services:3004
      PATIENT_SERVICE_URL: patient-services:3003
      SERVICE_TOKEN: ${SERVICE_TOKEN:-service-secret-token-123}
    env_file:
      - ./services/gateway/.env

  medicine-services:
    build:
      context: ./services/medicine_services
    container_name: medicine-service
    restart: unless-stopped
    depends_on:
      medicine-postgres:
        condition: service_healthy
    expose:
      - "9090"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://medicine-postgres:5432/medicine
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=123456
    networks:
      - internal


  user-services:
    build:
      context: ./services/user_services
    container_name: user-services
    restart: unless-stopped
    depends_on:
      user-mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3001"
    environment:
      GRPC_PORT: 3001
      GRPC_HOST: 0.0.0.0
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:adminpassword@user-mongodb:27017/user-services?authSource=admin
      REDIS_URL: redis://redis:6379
      SERVICE_TOKEN: ${SERVICE_TOKEN:-service-secret-token-123}
    networks:
      - internal
    volumes:
      - ./logs/user-services:/usr/src/app/logs

  doctor-services:
    build:
      context: ./services/doctor_services
    container_name: doctor-service
    restart: unless-stopped
    depends_on:
      doctor-mongodb:
        condition: service_healthy
    expose:
      - "3002"
    environment:
      GRPC_PORT: 3002
      GRPC_HOST: 0.0.0.0
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:adminpassword@doctor-mongodb:27017/doctor-management?authSource=admin
      SERVICE_TOKEN: ${SERVICE_TOKEN:-service-secret-token-123}
    networks:
      - internal
    volumes:
      - ./logs/doctor-services:/usr/src/app/logs

  patient-services:
    build:
      context: ./services/patient_services
    environment:
      MONGODB_URI: mongodb://patient-mongo:27017
    expose:
      - "3003"
    networks:
      - internal

  appointment-services:
    build:
      context: ./services/appointment_services
    container_name: appointment-service
    restart: unless-stopped
    depends_on:
      appointment-mongodb:
        condition: service_healthy
      doctor-services:
        condition: service_healthy
    expose:
      - "3004"
    environment:
      GRPC_PORT: 3004
      GRPC_HOST: 0.0.0.0
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:adminpassword@appointment-mongodb:27017/appointment-management?authSource=admin
      DOCTOR_SERVICE_GRPC_URL: doctor-services:3002
      SERVICE_TOKEN: ${SERVICE_TOKEN:-service-secret-token-123}
    networks:
      - internal
    volumes:
      - ./logs/appointment-services:/usr/src/app/logs


# ========================== Network & Volumes ==========================

networks:
  internal:
    driver: bridge

volumes:
  mongo-data:
  user_mongodb_data:
  doctor_mongodb_data:
  appointment_mongodb_data:
  redis_data:
  pgdata:
