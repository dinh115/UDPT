services:
  # MongoDB Databases
  user-mongodb:
    image: mongo:7
    container_name: user-services-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: user-services
    ports:
      - "27017:27017"
    volumes:
      - user_mongodb_data:/data/db
      - ./source/services/user_services/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - healthcare_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  doctor-mongodb:
    image: mongo:7
    container_name: doctor-service-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: doctor-management
    ports:
      - "27018:27017"
    volumes:
      - doctor_mongodb_data:/data/db
      - ./source/services/doctor_services/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - healthcare_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  appointment-mongodb:
    image: mongo:7
    container_name: appointment-service-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: appointment-management
    ports:
      - "27019:27017"
    volumes:
      - appointment_mongodb_data:/data/db
      - ./source/services/appointment_services/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - healthcare_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: user-services-redis
    restart: unless-stopped
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    networks:
      - healthcare_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: redis-server --appendonly yes

  # Microservices
  user-services:
    build:
      context: ./source/services/user_services
      dockerfile: Dockerfile
    container_name: user-services-service
    restart: unless-stopped
    depends_on:
      user-mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "50051:50051"
    environment:
      # Server Configuration
      GRPC_PORT: 50051
      GRPC_HOST: 0.0.0.0
      NODE_ENV: production
      
      # Database Configuration
      MONGODB_URI: mongodb://admin:adminpassword@user-mongodb:27017/user-services?authSource=admin
      MONGODB_TEST_URI: mongodb://admin:adminpassword@user-mongodb:27017/user-services-test?authSource=admin
      
      # Redis Configuration
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ""
      
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: 24h
      
      # Service Token
      SERVICE_TOKEN: ${SERVICE_TOKEN:-service-secret-token-123}
      
      # Session Configuration
      SESSION_CACHE_TTL: 86400
      
      # Bcrypt Configuration
      BCRYPT_ROUNDS: 12
      
      # Logging
      LOG_LEVEL: info
    networks:
      - healthcare_network
    volumes:
      - ./source/logs/user-services:/usr/src/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "const grpc = require('@grpc/grpc-js'); const client = new grpc.Client('localhost:50051', grpc.credentials.createInsecure()); client.waitForReady(Date.now() + 1000, (err) => process.exit(err ? 1 : 0));"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  doctor-services:
    build:
      context: ./source/services/doctor_services
      dockerfile: Dockerfile
    container_name: doctor-service
    restart: unless-stopped
    depends_on:
      doctor-mongodb:
        condition: service_healthy
    ports:
      - "50052:50052"
    environment:
      # Server Configuration
      GRPC_PORT: 50052
      GRPC_HOST: 0.0.0.0
      NODE_ENV: production
      
      # Database Configuration
      MONGODB_URI: mongodb://admin:adminpassword@doctor-mongodb:27017/doctor-management?authSource=admin
      MONGODB_TEST_URI: mongodb://admin:adminpassword@doctor-mongodb:27017/doctor-management-test?authSource=admin
      
      # Timeslot Generation Config
      TIMESLOT_GAP: ${TIMESLOT_GAP:-30}
      
      # Service Token
      SERVICE_TOKEN: ${SERVICE_TOKEN:-service-secret-token-123}
      
      # Logging
      LOG_LEVEL: info
    networks:
      - healthcare_network
    volumes:
      - ./source/logs/doctor-services:/usr/src/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "const grpc = require('@grpc/grpc-js'); const client = new grpc.Client('localhost:50052', grpc.credentials.createInsecure()); client.waitForReady(Date.now() + 1000, (err) => process.exit(err ? 1 : 0));"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  appointment-services:
    build:
      context: ./source/services/appointment_services
      dockerfile: Dockerfile
    container_name: appointment-service
    restart: unless-stopped
    depends_on:
      appointment-mongodb:
        condition: service_healthy
      doctor-services:
        condition: service_healthy
    ports:
      - "50053:50053"
    environment:
      # Server Configuration
      GRPC_PORT: 50053
      GRPC_HOST: 0.0.0.0
      NODE_ENV: production
      
      # Database Configuration
      MONGODB_URI: mongodb://admin:adminpassword@appointment-mongodb:27017/appointment-management?authSource=admin
      MONGODB_TEST_URI: mongodb://admin:adminpassword@appointment-mongodb:27017/appointment-management-test?authSource=admin
      
      # Doctor Service Configuration (internal network communication)
      DOCTOR_SERVICE_GRPC_URL: doctor-services:50052
      DOCTOR_GRPC_HOST: doctor-services
      DOCTOR_GRPC_PORT: 50052
      
      # Service Token for Internal APIs
      SERVICE_TOKEN: ${SERVICE_TOKEN:-service-secret-token-123}
      
      # Logging
      LOG_LEVEL: info
    networks:
      - healthcare_network
    volumes:
      - ./source/logs/appointment-services:/usr/src/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "const grpc = require('@grpc/grpc-js'); const client = new grpc.Client('localhost:50053', grpc.credentials.createInsecure()); client.waitForReady(Date.now() + 1000, (err) => process.exit(err ? 1 : 0));"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  patient-services:
    build:
      context: ./source/services/patient_services
    container_name: patient-services
    restart: unless-stopped
    expose:
      - "3001"
    networks:
      - healthcare_network
    environment:
      # Add any environment variables your patient service needs
      SERVICE_TOKEN: ${SERVICE_TOKEN:-service-secret-token-123}
      NODE_ENV: production

  gateway:
    build:
      context: ./source/services/gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - patient-services
      - user-services
      - doctor-services
      - appointment-services
    networks:
      - healthcare_network
    environment:
      # Gateway configuration
      NODE_ENV: production
      
      # Service endpoints (internal network communication)
      USER_SERVICE_URL: user-services:50051
      DOCTOR_SERVICE_URL: doctor-services:50052
      APPOINTMENT_SERVICE_URL: appointment-services:50053
      PATIENT_SERVICE_URL: patient-services:3001
      
      # Service Token
      SERVICE_TOKEN: ${SERVICE_TOKEN:-service-secret-token-123}

# Uncomment when you're ready to add the frontend
# frontend:
#   build:
#     context: ./source/frontend
#   container_name: healthcare-frontend
#   restart: unless-stopped
#   ports:
#     - "8080:80"
#   depends_on:
#     - gateway
#   networks:
#     - healthcare_network

networks:
  healthcare_network:
    driver: bridge
    name: healthcare_network

volumes:
  user_mongodb_data:
    driver: local
    name: user-services-mongodb-data
  doctor_mongodb_data:
    driver: local
    name: doctor-service-mongodb-data
  appointment_mongodb_data:
    driver: local
    name: appointment-service-mongodb-data
  redis_data:
    driver: local
    name: user-services-redis-data